<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria B / C — Recanto das Asas</title><style>
body{margin:0;background:#f4f8fa;color:#183a4d;font:15px system-ui,sans-serif}header{padding:24px;background:white;border-bottom:1px solid #d4e2e8}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#58717e;line-height:1.6}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}a{color:#054973}a.control{background:#e8f2f5;padding:12px 16px;border-radius:8px;text-decoration:none}main{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:white;border:1px solid #d4e2e8;border-radius:12px;padding:20px;min-width:0}h2{font-size:20px}h3{font-size:15px;margin-top:24px}img{max-width:100%;height:auto;border:1px solid #d4e2e8;border-radius:8px}.mobile img{width:390px}.mobile{text-align:center}.note{font-size:12px;margin-top:8px}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}header{padding:20px}article{padding:16px}}
</style></head><body><header><h1>Recanto das Asas — desktop B e Android C</h1><p>Prévias para aprovação. Dados e foto ilustrativos; aplicativo e base pessoal preservados.</p><nav><a class="control" href="index.html?platform=desktop&theme=light&screen=home">Explorar desktop claro</a><a class="control" href="index.html?platform=desktop&theme=dark&screen=home">Explorar desktop escuro</a><a class="control" href="index.html?platform=android&theme=light&screen=profile">Explorar Android claro</a><a class="control" href="index.html?platform=android&theme=dark&screen=profile">Explorar Android escuro</a><a class="control" href="PLANO-E-AUDITORIA.md">Plano e auditoria</a></nav></header><main id="gallery"></main><script>
const main=document.getElementById('gallery');for(const platform of ['desktop','android'])for(const theme of ['light','dark']){const article=document.createElement('article');if(platform==='android')article.className='mobile';article.innerHTML=`<h2>${platform==='desktop'?'Desktop B':'Android C'} · ${theme==='light'?'claro':'escuro'}</h2>`;for(const [screen,label]of[['home','Início'],['birds','Aves — lista com fotos'],['profile','Ficha da ave'],['form','Cadastro de ave'],['health','Saúde e peso']])article.innerHTML+=`<h3>${label}</h3><a href="capturas/${platform}-${theme}-${screen}.png"><img src="capturas/${platform}-${theme}-${screen}.png" alt="${label} ${platform} ${theme}" loading="lazy"></a><p class="note"><a href="index.html?platform=${platform}&theme=${theme}&screen=${screen}">Abrir tela de amostra</a> · <a href="capturas/${platform}-${theme}-${screen}-completo.png">Ver conteúdo completo</a></p>`;main.append(article)}
</script></body></html>
