<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recanto das Asas — comparativo visual</title><style>body{margin:0;padding:24px;background:#edf3f0;color:#233a38;font:16px/1.6 system-ui,sans-serif}main{max-width:1680px;margin:auto}h1{font-size:24px;margin:0 0 4px}p{margin:0 0 20px;color:#536a65}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:20px 0}select{font:inherit;padding:10px;border:1px solid #82978f;border-radius:8px;background:white;color:inherit}label{display:flex;gap:10px;align-items:center}.views{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0;background:white;border:1px solid #d2e0d8;border-radius:12px;overflow:hidden}figcaption{padding:12px 16px;font-weight:600}img{display:block;width:100%;height:auto;border-top:1px solid #d2e0d8}a{color:#286b63}a:focus-visible,select:focus-visible{outline:3px solid #287d78;outline-offset:3px}@media(max-width:700px){body{padding:12px}.views{grid-template-columns:1fr}}</style><main><h1>Recanto das Asas — antes e depois</h1><p>Capturas reais de navegador, feitas com registros fictícios na demonstração e em instalações de teste isoladas. As imagens foram preservadas sem filtros ou edição.</p><div class="controls"><label>Tela <select id="screen"><option value="01-acesso-desktop">Acesso — computador</option><option value="02-inicio-desktop" selected>Início — computador</option><option value="03-aves-desktop">Aves — computador</option><option value="04-ficha-ave-desktop">Ficha da ave — computador</option><option value="05-saude-desktop">Saúde e manejo — computador</option><option value="06-contatos-desktop">Contatos — computador</option><option value="07-financeiro-desktop">Financeiro — computador</option><option value="08-inicio-mobile">Início — telefone</option><option value="09-cadastro-ave-mobile">Cadastro da ave — telefone</option></select></label><label>Tema novo <select id="theme"><option value="light">Claro</option><option value="dark">Escuro — disponível no comparativo do Início</option></select></label></div><div class="views"><figure><figcaption>Antes · interface 0.2.0</figcaption><a id="before-link" href="before/02-inicio-desktop.png"><img id="before" src="before/02-inicio-desktop.png" alt="Interface anterior"></a></figure><figure><figcaption id="after-caption">Depois · redesign claro</figcaption><a id="after-link" href="after/02-inicio-desktop.png"><img id="after" src="after/02-inicio-desktop.png" alt="Interface atualizada"></a></figure></div></main><script>const screen=document.querySelector('#screen'),theme=document.querySelector('#theme');function update(){const key=screen.value;const dark=theme.value==='dark'&&['02-inicio-desktop','08-inicio-mobile'].includes(key);const final=dark?(key==='02-inicio-desktop'?'10-inicio-escuro-desktop':'11-inicio-escuro-mobile'):key;document.querySelector('#before').src='before/'+key+'.png';document.querySelector('#before-link').href='before/'+key+'.png';document.querySelector('#after').src='after/'+final+'.png';document.querySelector('#after-link').href='after/'+final+'.png';document.querySelector('#after-caption').textContent='Depois · redesign '+(dark?'escuro':'claro');theme.disabled=!['02-inicio-desktop','08-inicio-mobile'].includes(key);}screen.addEventListener('change',update);theme.addEventListener('change',update);update();</script></html>
